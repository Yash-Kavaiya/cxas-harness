  <h1>This website</h1>

  <h2>How a page is built</h2>
  <p>Each HTML file has a <code>&lt;template id="page"&gt;</code> with the article body. <code>assets/site.js</code> injects the shared header, sidebar, search filter, and footer, then clones the template into <code>#content</code>. <code>body[data-page]</code> marks the active nav item.</p>
  <p>Styles live in <code>assets/style.css</code>. The architecture page also loads Mermaid from a CDN to render the environment chart.</p>
  <p>Links between pages are relative (<code>cli.html</code>, not <code>/cli.html</code>) so the site works both at the GitHub Pages project root <code>/cxas-harness/</code> and when opened from a local folder.</p>

  <h2>Local preview</h2>
  <pre><code>cd docs-site
python -m http.server 8080
# open http://127.0.0.1:8080/</code></pre>
  <p>Do not open files via <code>file://</code> if you care about the search box and consistent relative URLs; a static server is enough.</p>

  <h2>Deploy</h2>
  <p>GitHub Pages serves the <code>gh-pages</code> branch. That branch is the contents of <code>docs-site/</code> from <code>master</code> (not the whole workspace).</p>
  <ol>
    <li>Edit HTML/CSS/JS under <code>docs-site/</code> on <code>master</code></li>
    <li>Publish by copying that directory to the <code>gh-pages</code> branch root</li>
    <li>GitHub Pages serves <a href="https://yash-kavaiya.github.io/cxas-harness/">https://yash-kavaiya.github.io/cxas-harness/</a></li>
  </ol>
  <p><code>.nojekyll</code> tells GitHub not to run Jekyll. <code>404.html</code> is the not-found page.</p>

  <h2>mdBook</h2>
  <p>Phase 5 also required an mdBook sidebar (Docs / Examples / Agent Skills / Core SDK) under <code>book/</code>. That book is the in-repo outline; this website is the published, detailed documentation. Edit both if you change user-facing behavior.</p>

  <h2>Editing rules</h2>
  <ul>
    <li>Document what the code does now, including mock limits</li>
    <li>Keep command flags in sync with <code>crates/cxas-cli/src/args.rs</code></li>
    <li>Keep issue rows in sync with <code>docs/superpowers/coverage-map.md</code></li>
    <li>Do not invent live CES behavior</li>
  </ul>
