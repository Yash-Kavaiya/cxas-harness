[package]
name = "cxas-utils"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[features]
default = []
sheets = []
bigquery = []
audio = []
graphviz = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
