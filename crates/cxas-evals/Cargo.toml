[package]
name = "cxas-evals"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[dependencies]
bytes = "1"
cxas-core = { path = "../cxas-core" }
cxas-proto = { path = "../cxas-proto" }
cxas-state = { path = "../cxas-state" }
cxas-utils = { path = "../cxas-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
