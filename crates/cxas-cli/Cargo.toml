[package]
name = "cxas-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[[bin]]
name = "cxas"
path = "src/main.rs"

[features]
default = ["remote"]
# Live CES calls. On by default: a harness that cannot reach the service is
# a linter. Off, `cxas api call` reports FEATURE_DISABLED rather than vanishing.
remote = ["cxas-core/rest"]
llm = ["cxas-lint/llm"]

[dependencies]
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
cxas-core = { path = "../cxas-core" }
cxas-evals = { path = "../cxas-evals" }
cxas-lint = { path = "../cxas-lint" }
cxas-migration = { path = "../cxas-migration" }
cxas-parity = { path = "../cxas-parity" }
cxas-state = { path = "../cxas-state" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
